<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Movido" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="application-name" content="Movido Driver" />
  <meta name="description" content="Movido HGV Driver App" />

  <!-- Icons -->
  <link rel="manifest" href="/movido-driver-web/manifest.json" />

  <link rel="icon" type="image/png" sizes="192x192" href="/movido-driver-web/icon-192.png" />

  <title>Movido Driver</title>

  <!-- Safe area for notch/home bar -->
  <style>
    body { margin: 0; background: #0a0a0f; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  </style>
  <script type="module" crossorigin src="/movido-driver-web/assets/index-BLi3_Xm3.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/movido-driver-web/sw.js')
          .then(r => console.log('SW registered:', r.scope))
          .catch(e => console.log('SW failed:', e))
      })
    }
  </script>
</body>
</html>
